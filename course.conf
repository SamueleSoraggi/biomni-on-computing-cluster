# Course settings for the student commands (biomni-setup / biomni-start / biomni-stop).
# Edit these once for your course; students never touch this file.

# SLURM account (= GenomeDK project) the students' jobs are billed to
ACCOUNT=hdssandbox

# Resources for one student's web UI session
PARTITION=short
CPUS=4
MEM=16G
TIME=04:00:00          # session ends automatically after this (max 12:00:00 on 'short')

# Address students use to log in to the cluster (shown in the connection instructions)
LOGIN_HOST=login.genome.au.dk

# Model used when a student doesn't choose one in biomni-setup
DEFAULT_ANTHROPIC_MODEL=claude-sonnet-4-5
DEFAULT_OPENAI_MODEL=gpt-4o
DEFAULT_GEMINI_MODEL=gemini-2.5-pro

# Shared data lake (downloaded once by the instructor). Empty = <install dir>/data
DATA_PATH=

# Where each student's sessions and results go
WORK_DIR=$HOME/biomni_work

# Login node that compute nodes tunnel through to reach the course model server on a GPU node
# (CPU compute nodes cannot reach GPU nodes directly on GenomeDK)
TUNNEL_HOST=fe-open-02
